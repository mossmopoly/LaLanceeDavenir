
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groupe Scolaire La Lancée D'avenir</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
</head>
<body class="bg-white text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-green-700 text-white py-4 shadow-md">
    <div class="container mx-auto px-4">
      <h1 class="text-2xl font-bold">Groupe Scolaire La Lancée D'avenir</h1>
    </div>
  </header>

  <!-- Slider Section -->
  <section class="my-8">
    <div class="swiper mySwiper w-full max-w-5xl mx-auto rounded-2xl overflow-hidden shadow-lg">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="images/photo1.jpg" alt="Photo 1" class="w-full h-auto" /></div>
        <div class="swiper-slide"><img src="images/photo2.jpg" alt="Photo 2" class="w-full h-auto" /></div>
        <div class="swiper-slide"><img src="images/photo3.jpg" alt="Photo 3" class="w-full h-auto" /></div>
        <div class="swiper-slide"><img src="images/photo4.jpg" alt="Photo 4" class="w-full h-auto" /></div>
        <div class="swiper-slide"><img src="images/photo5.jpg" alt="Photo 5" class="w-full h-auto" /></div>
        <div class="swiper-slide"><img src="images/photo6.jpg" alt="Photo 6" class="w-full h-auto" /></div>
      </div>
      <div class="swiper-pagination"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>
  </section>

  <!-- Content -->
  <main class="container mx-auto px-4">
    <p class="text-lg">Bienvenue sur le site officiel du Groupe Scolaire La Lancée D'avenir...</p>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-100 text-center py-4 mt-8">
    <p>© 2025 Groupe Scolaire La Lancée D'avenir</p>
  </footer>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      loop: true,
      autoplay: {
        delay: 3000,
        disableOnInteraction: false,
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });
  </script>

</body>
</html>
